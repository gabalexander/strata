strata: 1
id: checkout
title: Checkout platform
kind: architecture
category: platform
summary: Trace order creation from the web app to Postgres and follow the confirmation event to the email provider.
tags: [demo]
glossaries: [http, grpc, go, redis, postgres, kafka, consistency, resilience]
narration: "Follow Place order to Postgres, then follow OrderPlaced to the mailer. Select a service to see the endpoints, queries, keys and topics it uses. Double-click orders-svc to trace validation and the outbox relay."

terms:
  - id: order-placed
    term: OrderPlaced
    short: The event this checkout emits after committing an order.
    detail: The mailer consumes it to send the confirmation independently of the HTTP response.

enums:
  - id: order-status
    label: Order status
    doc: Stored as a smallint in orders.status and sent as a code in OrderPlaced. The API and the order page show the name.
    code: services/orders/domain/status.go:9
    values:
      - { value: 10, name: placed, doc: Committed by PlaceOrder with an authorized payment. }
      - { value: 20, name: paid, doc: The provider captured the payment. The warehouse can ship it. }
      - { value: 30, name: shipped, terminal: true, doc: Handed to the carrier. Returns are handled outside this map. }
      - { value: 90, name: cancelled, terminal: true, doc: "The payment was declined, or refunded before shipping." }
    transitions:
      - { from: 10, to: 20, label: payment captured, by: orders/capture-payment }
      - { from: 10, to: 90, label: payment declined, by: orders/decline-payment }
      - { from: 20, to: 30, label: warehouse ships it }
      - { from: 20, to: 90, label: refunded, by: orders/refund-payment }
  - id: payment-status
    label: Payment status
    doc: Stored as text in payments.status. The provider's webhook moves it on after checkout.
    code: services/orders/payments/status.go:6
    values:
      - { value: authorized, name: authorized, doc: Inserted with the order. The provider holds the amount on the card. }
      - { value: captured, name: captured, doc: The provider took the money. }
      - { value: refunded, name: refunded, terminal: true, doc: The money went back to the customer. }
      - { value: failed, name: failed, terminal: true, doc: The provider declined the capture. }
    transitions:
      - { from: authorized, to: captured, label: provider captures, by: orders/capture-payment }
      - { from: authorized, to: failed, label: provider declines, by: orders/decline-payment }
      - { from: captured, to: refunded, label: refund, by: orders/refund-payment }

groups:
  - { id: backend, label: Checkout backend, kind: cluster }

nodes:
  - id: web
    kind: client
    label: Web app
    tech: React
    at: [0, 1]
    doc: |
      Sends a checkout request when the customer places an order.
      A gateway error leaves the customer without a confirmation.
    ops:
      - id: submit-order
        kind: http
        target: api
        label: POST /v1/orders
        method: POST
        path: /v1/orders
        request: '{ "cart_id": "c_81f2", "payment_token": "tok_…" }'
        calls: api/post-orders
        code: web/src/checkout/placeOrder.ts:31
        doc: Sends the cart with an Idempotency-Key header that it generates once per checkout attempt.
        facts:
          timeout: 10s, then the page shows a retry button
          idempotency key: one UUID per checkout, reused on retry
  - id: api
    kind: gateway
    label: API gateway
    tech: Envoy
    group: backend
    at: [1, 1]
    doc: |
      Accepts HTTPS requests and forwards each order to orders-svc over gRPC.
      A short timeout with retries can send the same order to the service several times.
    ops:
      - id: post-orders
        kind: http
        label: POST /v1/orders
        method: POST
        path: /v1/orders
        request: '{ "cart_id": "c_81f2", "payment_token": "tok_…" }'
        response: '{ "order_id": "o_9k2", "status": "placed" }'
        status: ["201 created", "400 invalid cart", "401 no session", "429 rate limited", "503 orders-svc unavailable"]
        code: deploy/envoy/routes.yaml:18
        doc: Checks the session, applies the per-user rate limit, and transcodes the JSON body to PlaceOrder.
        facts:
          auth: session JWT, verified at the edge
          rate limit: 20 requests/s per user
          transcoding: grpc_json_transcoder with orders.v1 descriptors
      - id: forward-place-order
        kind: rpc
        target: orders
        label: PlaceOrder
        method: orders.v1.Orders/PlaceOrder
        streaming: unary
        calls: orders/place-order
        code: deploy/envoy/clusters.yaml:42
        risks: [a retry after a lost response commits the order twice unless the idempotency key reaches orders-svc]
        facts:
          timeout: route timeout (api.timeout)
          retries: api.retries, on 5xx and connection reset
          idempotency: forwards Idempotency-Key as x-idempotency-key metadata
  - id: orders
    kind: service
    label: orders-svc
    tech: Go
    group: backend
    at: [2, 1]
    latency: 30ms
    concurrency: 4
    replicas: 2
    term: grpc/unary
    doc: |
      Reads the price and commits the order before the confirmation email can be sent.
      Slow Redis calls hold its request slots. A refused Postgres write fails checkout.
    ops:
      - id: place-order
        kind: rpc
        label: PlaceOrder
        method: orders.v1.Orders/PlaceOrder
        streaming: unary
        request: '{ "user_id": "u_17", "cart_id": "c_81f2", "idempotency_key": "7f3c…" }'
        response: '{ "order_id": "o_9k2", "total_cents": 4200 }'
        status: [OK, INVALID_ARGUMENT empty cart, ALREADY_EXISTS duplicate idempotency key, UNAVAILABLE database down]
        code: services/orders/grpc/server.go:57
        doc: Prices the cart, commits the order with its outbox row, then emits OrderPlaced.
        formula:
          expr: "total = Σ_i qty_i · price_i · (1 − d) + ship"
          where:
            qty_i: quantity of cart line i
            price_i: "unit price in cents, read through price:{sku} (cached for 5 min)"
            d: discount rate of the applied promo code (0 without one)
            ship: shipping in cents (0 for orders above 40 EUR)
          example: "o_9k2: 2 · 1250 + 1 · 1700 = 4200, no promo, free shipping → total_cents 4200"
          doc: Computed in integer cents after every price is known, so the total written to orders.total_cents and the payment amount always agree.
          code: services/orders/pricing/total.go:14
        facts:
          deadline: inherits the gateway timeout
          idempotency: unique index on orders.idempotency_key
      - id: get-order
        kind: rpc
        label: GetOrder
        method: orders.v1.Orders/GetOrder
        streaming: unary
        request: '{ "order_id": "o_9k2" }'
        response: '{ "order_id": "o_9k2", "status": "paid", "items": [{ "sku": "A-1", "qty": 2 }], "payment": { "status": "captured" } }'
        status: [OK, NOT_FOUND, PERMISSION_DENIED order of another user]
        code: services/orders/grpc/server.go:112
        doc: Loads the Order aggregate for the order page. Not part of checkout, so no flow names it.
      - id: load-order
        kind: sql
        target: db
        label: SELECT order aggregate
        access: read
        tables: [orders, order_items, payments, users]
        indexes: [orders_pkey, order_items_pkey, payments_order_id_key, users_pkey]
        query: |
          -- name: LoadOrder :many
          SELECT o.id, o.status, o.total_cents, o.currency, u.email, u.display_name,
                 i.sku, i.qty, i.price_cents, p.status AS payment_status
          FROM orders o
          JOIN users u ON u.id = o.user_id
          JOIN order_items i ON i.order_id = o.id
          LEFT JOIN payments p ON p.order_id = o.id
          WHERE o.id = $1;
        code: services/orders/db/queries/orders.sql:41
        doc: One round trip for the whole aggregate. The order page polls it while a payment is pending.
      - id: get-price
        kind: cache
        target: cache
        label: GET price
        command: GET
        key: "price:{sku}"
        access: read
        code: services/orders/pricing/cache.go:31
        facts:
          client: go-redis v9, 10 connections per replica
          on miss: read Postgres, then SET with a 5m TTL
      - id: set-price
        kind: cache
        target: cache
        label: SET price
        command: SET EX 300
        key: "price:{sku}"
        ttl: 5m
        access: write
        code: services/orders/pricing/cache.go:48
        risks: [concurrent misses on one hot SKU all read Postgres before the first SET lands]
      - id: read-price
        kind: sql
        target: db
        label: SELECT price
        access: read
        tables: [prices]
        indexes: [prices_pkey]
        query: |
          -- name: GetPrice :one
          SELECT amount_cents, currency
          FROM prices
          WHERE sku = $1;
        code: services/orders/db/queries/prices.sql:3
      - id: insert-order
        kind: sql
        target: db
        label: INSERT order + outbox
        access: write
        tables: [orders, order_items, payments, outbox]
        indexes: [orders_idempotency_key_key, payments_order_id_key, outbox_unpublished_idx]
        tx: true
        locks: row
        query: |
          BEGIN;

          INSERT INTO orders (id, user_id, status, total_cents, currency, idempotency_key)
          VALUES ($1, $2, 10, $3, 'EUR', $4);

          INSERT INTO order_items (order_id, sku, qty, price_cents)
          SELECT $1, unnest($5::text[]), unnest($6::int[]), unnest($7::int[]);

          INSERT INTO payments (id, order_id, token, amount_cents, status)
          VALUES ($9, $1, $10, $3, 'authorized');

          INSERT INTO outbox (topic, key, payload)
          VALUES ('order-events', $1, $8);

          COMMIT;
        code: services/orders/db/queries/orders.sql:12
        doc: Writes the order, its items, the authorized payment and the outbox row in one transaction, so the event exists only if the order does.
        risks:
          - a duplicate idempotency key aborts the whole transaction (ALREADY_EXISTS)
          - a slow COMMIT holds an orders-svc slot and a pool connection
        facts:
          isolation: read committed
          pool: pgxpool, 20 connections per replica
        inside:
          narration: "One commit runs four inserts on one pooled connection. The orders row stays locked until COMMIT, so a retry with the same idempotency key waits for it."
          nodes:
            - id: conn
              kind: port
              label: pgx connection
              at: [0, 1]
              doc: The pooled connection orders-svc borrows for the transaction.
            - id: txn
              kind: service
              label: BEGIN … COMMIT
              latency: 0.2ms
              at: [1, 1]
              doc: |
                Runs the statements in order on one connection.
                Any failed insert rolls back all four.
            - id: orders-row
              kind: database
              label: orders
              latency: 1ms
              at: [2, 0]
              doc: The order row. Its unique idempotency key rejects a duplicate checkout.
            - id: items-rows
              kind: database
              label: order_items
              latency: 1.5ms
              at: [2, 1]
              doc: One row per cart line, inserted with unnest in a single statement.
            - id: payment-row
              kind: database
              label: payments
              latency: 0.5ms
              at: [2, 2]
              doc: The authorized payment. The provider's webhook, which is not on this map, marks it captured later.
            - id: outbox-row
              kind: database
              label: outbox
              latency: 0.5ms
              at: [2, 3]
              doc: The OrderPlaced row the relay publishes after COMMIT.
          edges:
            - { from: conn, to: txn, protocol: sql }
            - { from: txn, to: orders-row, label: INSERT }
            - { from: txn, to: items-rows, label: INSERT }
            - { from: txn, to: payment-row, label: INSERT }
            - { from: txn, to: outbox-row, label: INSERT }
          flows:
            - id: commit
              label: Order transaction
              from: conn
              rate: parent
              steps:
                - call: txn
                  steps:
                    - { call: orders-row, label: INSERT orders }
                    - { call: items-rows, label: INSERT order_items }
                    - { call: payment-row, label: INSERT payments }
                    - { call: outbox-row, label: INSERT outbox }
      - id: order-placed
        kind: publish
        target: events
        label: OrderPlaced
        topic: order-events
        key: order_id
        payload: '{ "order_id": "o_9k2", "status": 10, "user_id": "u_17", "email": "ada.k@example.com", "total_cents": 4200, "currency": "EUR" }'
        calls: mailer/on-order-placed
        code: services/orders/events/producer.go:29
        doc: In production the outbox relay publishes this row after COMMIT. The overview publishes at commit to show the route.
        facts:
          acks: all
          idempotent producer: "yes"
          schema: orders.v1.OrderPlaced (protobuf)
      - id: payment-webhook
        kind: http
        label: POST /v1/payments/webhook
        method: POST
        path: /v1/payments/webhook
        request: '{ "type": "payment.captured", "payment_id": "p_5x4", "order_id": "o_9k7", "status": "captured" }'
        status: ["200 ok", "401 bad signature", "409 payment already moved on"]
        code: services/orders/payments/webhook.go:24
        doc: The payment provider calls it when it captures, declines or refunds a payment. It checks the signature, then runs the matching update. Not part of checkout, so no flow names it.
        facts:
          auth: HMAC signature header, checked before the body is parsed
          idempotency: each update names the state it expects, so a replayed event changes nothing (409)
      - id: capture-payment
        kind: sql
        target: db
        label: Capture payment
        access: write
        tables: [payments, orders]
        tx: true
        locks: row
        query: |
          -- name: CapturePayment :exec
          UPDATE payments
          SET status = 'captured'
          WHERE id = $1
            AND status = 'authorized';

          UPDATE orders
          SET status = 20
          WHERE id = $2
            AND status = 10;
        code: services/orders/db/queries/payments.sql:8
        doc: Marks the payment captured and the order paid in one transaction.
      - id: decline-payment
        kind: sql
        target: db
        label: Decline payment
        access: write
        tables: [payments, orders]
        tx: true
        locks: row
        query: |
          -- name: DeclinePayment :exec
          UPDATE payments
          SET status = 'failed'
          WHERE id = $1
            AND status = 'authorized';

          UPDATE orders
          SET status = 90
          WHERE id = $2
            AND status = 10;
        code: services/orders/db/queries/payments.sql:21
        doc: The provider declined the capture, so the order is cancelled.
      - id: refund-payment
        kind: sql
        target: db
        label: Refund payment
        access: write
        tables: [payments, orders]
        tx: true
        locks: row
        query: |
          -- name: RefundPayment :exec
          UPDATE payments
          SET status = 'refunded'
          WHERE id = $1
            AND status = 'captured';

          UPDATE orders
          SET status = 90
          WHERE id = $2
            AND status IN (10, 20);
        code: services/orders/db/queries/payments.sql:34
        doc: A refund cancels the order unless it has already shipped.
        risks: [a refund after shipping leaves the order shipped; returns are handled outside this map]
    entities:
      - name: Order
        root: orders
        includes: [order_items, payments, users]
        doc: The aggregate PlaceOrder writes in one transaction and GetOrder loads in one query. Items and the payment belong to the order; the customer is a reference to the accounts data.
        code: services/orders/domain/order.go:14
      - name: Price
        root: prices
        doc: The value cached under price:{sku} for five minutes. A cache miss loads it with GetPrice.
        code: services/orders/pricing/price.go:9
    inside:
      narration: "Follow the handler through validation to the SQL transaction. Watch the relay poll that same table on its own schedule."
      nodes:
        - id: in
          kind: port
          label: Incoming order
          at: [0, 0.48]
          doc: |
            Represents the gateway outside this view and follows its measured request rate.
            When upstream traffic stops, this path goes quiet.
        - id: handler
          kind: service
          label: gRPC handler
          tech: Go
          binary: services/orders/cmd/orders
          code: services/orders/grpc/server.go
          latency: 2ms
          at: [1, 0]
          doc: |
            The orders binary's gRPC server. It checks the request with the validator before opening a database transaction.
            A failed validation or write propagates back to the gateway.
          ops:
            - id: place-order
              kind: rpc
              label: PlaceOrder
              method: orders.v1.Orders/PlaceOrder
              streaming: unary
              code: services/orders/grpc/server.go:57
              doc: Decodes the request, checks the cart, then commits the order and its outbox row.
            - id: validate-cart
              kind: call
              target: validate
              label: ValidateCart
              method: domain.ValidateCart(ctx, cart)
              calls: validate/check-cart
              code: services/orders/grpc/server.go:71
            - id: commit
              kind: sql
              target: tx
              label: INSERT order + outbox
              access: write
              tables: [orders, order_items, outbox]
              tx: true
              locks: row
              query: |
                -- in one pgx.Tx
                INSERT INTO orders (id, user_id, status, total_cents, idempotency_key)
                VALUES ($1, $2, 10, $3, $4);

                INSERT INTO order_items (order_id, sku, qty, price_cents)
                SELECT $1, unnest($5::text[]), unnest($6::int[]), unnest($7::int[]);

                INSERT INTO outbox (topic, key, payload)
                VALUES ('order-events', $1, $8);
              code: services/orders/repo/orders.go:88
        - id: validate
          kind: service
          label: Validator
          latency: 1ms
          at: [2, -0.9]
          code: services/orders/domain/validate.go
          doc: |
            Checks that the cart and quantities are valid before any write. A package inside the orders binary, not a process of its own.
            Inject an error here to model rejection before the SQL call.
          ops:
            - id: check-cart
              kind: call
              label: ValidateCart
              method: domain.ValidateCart(ctx, cart)
              request: '{ "items": [{ "sku": "A-1", "qty": 2 }] }'
              status: [ok, empty cart, quantity above 20, unknown SKU]
              code: services/orders/domain/validate.go:18
              doc: Pure checks with no I/O. A failure maps to INVALID_ARGUMENT.
        - id: tx
          kind: database
          label: Order + outbox
          tech: Postgres
          at: [3, 0]
          term: consistency/outbox
          doc: |
            Commits the order and its outbox row in one transaction.
            If the transaction fails, Postgres makes neither row visible.
        - id: relay
          kind: worker
          label: Outbox relay
          tech: Go
          binary: services/orders/cmd/outbox-relay
          code: services/orders/outbox/relay.go
          latency: 3ms
          at: [2, 1.35]
          term: consistency/relay
          doc: |
            Its own binary, deployed next to orders-svc. Polls Postgres for pending rows on its own schedule.
            A failed poll delays publication. The overview shows the Kafka handoff.
          how:
            - id: relay-cycle
              title: Outbox relay claim, publish and ack
              summary: |
                Every 500 ms the relay locks a batch of unpublished outbox rows, produces them to Kafka, and
                marks them published in the same transaction once the broker acks. A crash before COMMIT
                rolls the claim back, so the next poll sends the batch again: delivery is at least once.
              code: services/orders/outbox/relay.go:52
              participants:
                - { id: relay, label: outbox relay, node: relay }
                - { id: pg, label: Postgres, node: tx }
                - { id: kafka, label: Kafka, kind: topic }
              initial:
                - { key: "outbox#88124", value: pending }
                - { key: "outbox#88125", value: pending }
              steps:
                - id: claim
                  from: relay
                  to: pg
                  label: BEGIN and lock a batch
                  command: "SELECT id, payload FROM outbox WHERE published_at IS NULL ORDER BY id LIMIT 100 FOR UPDATE SKIP LOCKED"
                  reply: "88124, 88125"
                  at: 0ms
                  state: [ { key: "outbox#88124", value: locked }, { key: "outbox#88125", value: locked } ]
                  note: "The row locks last until COMMIT. `SKIP LOCKED` lets a second relay replica take other rows instead of waiting for these."
                - id: produce
                  from: relay
                  to: kafka
                  label: produce both events
                  command: "produce order-events keys [o_9m1, o_9m2] acks=all"
                  reply: "offsets 51007, 51008"
                  at: 4ms
                  note: "`acks=all`: the broker answers once every in-sync replica has the events."
                - id: ack
                  from: relay
                  to: pg
                  label: mark published and COMMIT
                  command: "UPDATE outbox SET published_at = now() WHERE id = ANY($1); COMMIT"
                  reply: "UPDATE 2 · COMMIT"
                  at: 9ms
                  state: [ { key: "outbox#88124", value: published }, { key: "outbox#88125", value: published } ]
                - id: idle
                  from: relay
                  to: pg
                  label: the next poll finds nothing
                  command: "SELECT id, payload FROM outbox WHERE published_at IS NULL … FOR UPDATE SKIP LOCKED"
                  reply: "(0 rows)"
                  at: 500ms
              branches:
                - id: crash
                  label: Relay dies before COMMIT
                  after: produce
                  note: Kafka already has both events, but Postgres never hears that they were sent.
                  steps:
                    - { id: die, from: relay, to: relay, label: relay crashes, at: 6ms }
                    - id: rollback
                      from: pg
                      to: pg
                      label: connection drops, Postgres rolls back
                      at: 6ms
                      state: [ { key: "outbox#88124", value: pending }, { key: "outbox#88125", value: pending } ]
                      note: "The locks go away with the transaction. The rows look exactly as they did before the claim."
                    - id: reclaim
                      from: relay
                      to: pg
                      label: the restarted relay locks the same rows
                      command: "SELECT id, payload FROM outbox WHERE published_at IS NULL ORDER BY id LIMIT 100 FOR UPDATE SKIP LOCKED"
                      reply: "88124, 88125"
                      at: 500ms
                      state: [ { key: "outbox#88124", value: locked }, { key: "outbox#88125", value: locked } ]
                    - id: again
                      from: relay
                      to: kafka
                      label: produce the same events again
                      command: "produce order-events keys [o_9m1, o_9m2] acks=all"
                      reply: "offsets 51011, 51012"
                      at: 504ms
                      note: "Each event is now in the topic twice. The mailer dedupes by `order_id`, which is what at least once delivery asks of every consumer."
                    - id: ack
                      from: relay
                      to: pg
                      label: mark published and COMMIT
                      command: "UPDATE outbox SET published_at = now() WHERE id = ANY($1); COMMIT"
                      reply: "UPDATE 2 · COMMIT"
                      at: 509ms
                      state: [ { key: "outbox#88124", value: published }, { key: "outbox#88125", value: published } ]
          ops:
            - id: poll-outbox
              kind: sql
              target: tx
              label: Claim pending outbox rows
              access: read-write
              tables: [outbox]
              indexes: [outbox_unpublished_idx]
              tx: true
              locks: row, SKIP LOCKED
              query: |
                -- name: ClaimOutbox :many
                UPDATE outbox
                SET claimed_at = now()
                WHERE id IN (
                  SELECT id
                  FROM outbox
                  WHERE published_at IS NULL
                  ORDER BY id
                  LIMIT 100
                  FOR UPDATE SKIP LOCKED
                )
                RETURNING id, topic, key, payload;
              code: services/orders/outbox/relay.go:52
              doc: SKIP LOCKED lets several relay replicas claim different rows without blocking each other.
            - id: produce
              kind: publish
              direction: out
              label: Produce OrderPlaced
              topic: order-events
              key: order_id
              code: services/orders/outbox/relay.go:77
              doc: Kafka is outside this view. The relay marks a row published only after the broker acks it.
              facts:
                batch: up to 100 rows per poll
                delivery: at least once; consumers dedupe by order_id
      edges:
        - { from: in, to: handler, protocol: grpc }
        - { from: in, to: relay, label: Poll timer }
        - { from: handler, to: validate, label: Check }
        - { from: handler, to: tx, protocol: sql, label: Commit }
        - { from: relay, to: tx, protocol: sql, label: Poll }
      flows:
        - id: requests
          label: Order transaction
          from: in
          rate: parent
          steps:
            - call: handler
              label: PlaceOrder
              op: place-order
              steps:
                - { call: validate, label: Validate cart, op: validate-cart }
                - { call: tx, label: Commit order and outbox, op: commit }
        - id: relay-polls
          label: Relay polls
          from: in
          rate: every 500ms
          color: 3
          steps:
            - call: relay
              steps:
                - { call: tx, label: Read pending outbox rows, op: poll-outbox }
  - id: cache
    kind: cache
    label: Price cache
    tech: Redis
    group: backend
    hitRate: 90%
    at: [3.2, 0]
    doc: |
      Answers most product price reads in about half a millisecond.
      A miss sends a price read to Postgres. Slow cache hits still hold order slots.
  - id: db
    kind: database
    label: Orders DB
    tech: Postgres
    group: backend
    at: [3.2, 1]
    doc: |
      Handles price reads on cache misses and commits every successful order.
      When it refuses a write, the request fails before publication.
      Row counts and growth are estimates.
    schema:
      - table: users
        doc: Customer accounts. The accounts service writes them; orders-svc only reads them.
        columns:
          - { name: id, type: text, pk: true, note: "u_ prefix" }
          - { name: email, type: citext, unique: true }
          - { name: display_name, type: text }
          - { name: created_at, type: timestamptz }
        indexes: ["users_pkey (id)", "users_email_key UNIQUE (email)"]
        rows:
          - [u_17, ada.k@example.com, Ada K., "2024-02-11 09:30"]
          - [u_18, noor.s@example.net, Noor S., "2024-06-03 18:02"]
          - [u_21, teo.m@example.org, Teo M., "2025-01-19 07:45"]
          - [u_34, lin.w@example.com, Lin W., "2025-08-30 21:10"]
        volume: { rows: 9.5M, growth: 6k/day }
      - table: prices
        doc: Current price per SKU. The catalog admin writes them; orders-svc caches them in Redis.
        columns:
          - { name: sku, type: text, pk: true }
          - { name: amount_cents, type: integer }
          - { name: currency, type: char(3) }
          - { name: updated_at, type: timestamptz }
        indexes: ["prices_pkey (sku)"]
        rows:
          - [A-1, 1250, EUR, "2025-10-01 08:00"]
          - [B-7, 1700, EUR, "2025-10-01 08:00"]
          - [C-3, 899, EUR, "2025-11-03 12:15"]
          - [D-4, 4999, EUR, "2025-09-12 16:40"]
        volume: { rows: 18k, growth: 40/day }
      - table: orders
        doc: One row per checkout, written by PlaceOrder.
        columns:
          - { name: id, type: text, pk: true, note: "o_ prefix" }
          - { name: user_id, type: text, ref: users.id }
          - { name: status, type: smallint, enum: order-status }
          - { name: total_cents, type: bigint }
          - { name: currency, type: char(3) }
          - { name: idempotency_key, type: uuid, unique: true, note: the gateway's Idempotency-Key }
          - { name: created_at, type: timestamptz }
        indexes:
          - orders_pkey (id)
          - orders_idempotency_key_key UNIQUE (idempotency_key)
          - orders_user_id_created_at_idx (user_id, created_at DESC)
        rows:
          - [o_9k2, u_17, 20, 4200, EUR, 7f3c2a90-1b4e-4c1d-9a55-0e8b1f6c2d17, "2025-11-14 10:02"]
          - [o_9k3, u_18, 90, 899, EUR, 2d81c4e7-5f60-4a3b-8c19-b7e2d4f09a63, "2025-11-14 10:05"]
          - [o_9k4, u_17, 30, 7499, EUR, c94b0f18-3e7a-4d25-a6f1-58d2e9c7b304, "2025-11-14 10:11"]
          - [o_9k7, u_21, 10, 1700, EUR, 61e5a3d2-9c84-4f07-b2e6-0a7f3c1d8e95, "2025-11-14 10:19"]
        volume: { rows: 140M, growth: 400k/day }
      - table: order_items
        doc: One row per cart line. The price is copied from prices when the order is placed.
        columns:
          - { name: order_id, type: text, pk: true, ref: orders.id }
          - { name: sku, type: text, pk: true, ref: prices.sku }
          - { name: qty, type: integer }
          - { name: price_cents, type: integer }
        indexes: ["order_items_pkey (order_id, sku)"]
        rows:
          - [o_9k2, A-1, 2, 1250]
          - [o_9k2, B-7, 1, 1700]
          - [o_9k3, C-3, 1, 899]
          - [o_9k4, D-4, 1, 4999]
          - [o_9k4, A-1, 2, 1250]
          - [o_9k7, B-7, 1, 1700]
        volume: { rows: 350M, growth: 1M/day }
      - table: payments
        doc: One authorization per order, inserted with it. The provider's webhook, which is not on this map, captures or refunds it later.
        columns:
          - { name: id, type: text, pk: true, note: "p_ prefix" }
          - { name: order_id, type: text, unique: true, ref: orders.id }
          - { name: token, type: text, note: the provider's payment token }
          - { name: amount_cents, type: bigint }
          - { name: status, type: text, enum: payment-status }
          - { name: created_at, type: timestamptz }
        indexes: ["payments_pkey (id)", "payments_order_id_key UNIQUE (order_id)"]
        rows:
